# TEMPORARY diagnostic workflow: the Test step fails intermittently on CI and
# never locally. Eight independent attempts per push turn a rare flake into a
# reproduction, and the output of a failing attempt is republished into the
# run summary because Actions logs need authentication even here.
#
# Delete this file once the flake is diagnosed.
name: Flake hunt

on:
  push:
    branches: [fix/ci-test-step]

jobs:
  attempt:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5, 6, 7, 8]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kidir
          POSTGRES_PASSWORD: kidir
          POSTGRES_DB: kidir
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kidir -d kidir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://kidir:kidir@localhost:5433/kidir?schema=public
      REDIS_URL: redis://localhost:6379
      API_PORT: "4000"
      WEB_URL: http://localhost:3000
      ADMIN_URL: http://localhost:3001
      JWT_ACCESS_SECRET: ci-access-secret-value-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-value-at-least-32-characters
      COOKIE_DOMAIN: localhost
      SMS_PROVIDER: mock
      MAIL_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run generate --workspace=apps/api

      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      # Six sequential runs per job, eight jobs: 48 attempts per push.
      # TURBO_FORCE stops the second run from replaying the first one's cache.
      - name: Test
        id: test
        env:
          TURBO_FORCE: "true"
        run: |
          for run in 1 2 3 4 5 6; do
            echo "===== attempt ${{ matrix.attempt }} run $run ====="
            npm run test 2>&1 | tee -a test-output.log
          done

      - name: Publish test output on failure
        if: failure() && steps.test.outcome == 'failure'
        run: |
          {
            echo "## Attempt ${{ matrix.attempt }} failed"
            echo
            echo '```'
            tail -n 400 test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
